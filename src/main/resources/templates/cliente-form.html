<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SysManut</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body><header th:replace="~{layout :: topo}"></header><main><h1>Cadastro de cliente</h1><div th:replace="~{layout :: erros}"></div>
<form class="cartao" method="post" th:action="@{/clientes}" th:object="${cliente}" data-validar data-servidor>
<input type="hidden" th:field="*{idCliente}">
<label for="nome">Nome</label><input th:field="*{nome}" required><div class="erro"></div>
<label for="telefone">Telefone</label><input th:field="*{telefone}" required placeholder="(53) 99999-0000"><div class="erro"></div>
<label for="email">E-mail</label><input th:field="*{email}" type="email" required><div class="erro"></div>
<label for="endereco">Endereço</label><input th:field="*{endereco}" required><div class="erro"></div>
<div class="acoes"><button class="btn">Salvar</button><a class="btn sec" th:href="@{/clientes}">Cancelar</a></div></form></main>
<script th:src="@{/js/comum.js}"></script></body></html>
